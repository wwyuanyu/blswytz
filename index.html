<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>正在跳转</title>
<style>
  body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
       font-family:system-ui,"Microsoft YaHei",sans-serif;background:#f5f7fb;color:#333;text-align:center;padding:24px;}
  .tip{opacity:.7;font-size:14px;margin-top:14px;max-width:320px;line-height:1.7;}
  .btn{margin-top:22px;padding:14px 38px;font-size:17px;font-weight:700;color:#fff;border:none;border-radius:40px;
       cursor:pointer;background:linear-gradient(135deg,#12b7f5,#0a90d8);box-shadow:0 6px 20px rgba(18,183,245,.35);transition:.3s;}
  .btn:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(18,183,245,.5);}
</style>
</head>
<body>
  <h2>正在为你打开QQ…</h2>
  <p class="tip">若未自动弹出，可能是浏览器拦截了自动唤起，请点击下面的按钮手动打开。</p>
  <button class="btn" id="openQQ">打开QQ</button>
<script>
  var OWNER_UIN = '3630418588';
  var QQ_URL = 'https://qm.qq.com/q/UY0AyskRau';

  function getCardScheme(uin) {
    return 'mqqapi://card/show_pslcard?src_type=internal&version=1&uin=' + encodeURIComponent(uin);
  }

  function isDesktop() {
    var ua = navigator.userAgent || '';
    var mobileRE = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini|Mobile/i;
    var isMobileUA = mobileRE.test(ua);
    var isCoarsePointer = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
    if (/iPad/.test(ua) || (navigator.platform === 'MacIntel' && isCoarsePointer)) return false;
    if (isMobileUA) return false;
    return true;
  }

  function openQQ(uin) {
    if (isDesktop()) {
      window.location.replace(QQ_URL);
      return;
    }
    var scheme = getCardScheme(uin);
    var done = false;
    var visHandler = function () {
      if (document.hidden) {
        done = true;
        clearTimeout(timer);
      }
      document.removeEventListener('visibilitychange', visHandler);
    };
    document.addEventListener('visibilitychange', visHandler);
    window.location.href = scheme;
    var timer = setTimeout(function () {
      if (!done) window.location.replace(QQ_URL);
    }, 1500);
  }

  document.getElementById('openQQ').addEventListener('click', function (e) {
    e.preventDefault();
    openQQ(OWNER_UIN);
  });

  openQQ(OWNER_UIN);
</script>
</body>
</html>
